# فحص ثابت للمشروع. القاعدة: flutter_lints + قواعد إضافية تلتقط أخطاء
# وقت التشغيل (تسريب مشتركات، Future منسي، مقارنات خاطئة).
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # تسريب الاشتراكات وفجوات الـ context أخطاء حقيقية — نرفعها من تلميح لخطأ.
    cancel_subscriptions: error
    close_sinks: error
    use_build_context_synchronously: error
    unrelated_type_equality_checks: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/firebase_options.dart"

linter:
  rules:
    # تسريبات موارد
    - cancel_subscriptions
    - close_sinks
    # صحّة منطقية
    - unrelated_type_equality_checks
    - throw_in_finally
    - avoid_empty_else
    - no_duplicate_case_values
    - unnecessary_statements
    - avoid_slow_async_io
    - collection_methods_unrelated_type
    # وضوح
    - always_declare_return_types
    - prefer_final_locals
    - unnecessary_parenthesis
